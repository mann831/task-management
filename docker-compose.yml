services:
  mongo:
    image: mongo:7
    container_name: task-management-mongo
    restart: unless-stopped
    volumes:
      - task-management-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/employee_tasks", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ./server
    container_name: task-management-server
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/employee_tasks
      JWT_SECRET: ${JWT_SECRET:?Run setup.bat to create the local .env file}
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: task-management-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

  seed:
    build:
      context: ./server
    profiles: ["setup"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/employee_tasks
    command: ["npm", "run", "seed"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  task-management-data:
